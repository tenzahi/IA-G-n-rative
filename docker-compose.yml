services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: idara
      POSTGRES_PASSWORD: idara_dev
      POSTGRES_DB: idara_derja
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idara -d idara_derja"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: idara_minio
      MINIO_ROOT_PASSWORD: idara_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    
  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  db_data:
  minio_data: